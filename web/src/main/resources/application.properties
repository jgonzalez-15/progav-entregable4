spring.application.name=rps3d
server.port=${PORT:8090}

# Ambiente y versión (los inyecta el pipeline al desplegar)
app.env=${APP_ENV:DEV}
app.version=${APP_VERSION:local}
app.commit=${APP_COMMIT:unknown}
app.idle-timeout=30m

# Persistencia del historial: H2 embebida en archivo (un volumen por ambiente)
spring.datasource.url=jdbc:h2:file:${APP_DATA_DIR:./data}/rps;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Healthcheck para smoke tests del pipeline
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true


# Modo competitivo (V2)
app.competitive.target-wins=2
app.competitive.max-counted-wins-per-opponent-per-day=3
app.competitive.base-tolerance=1
app.competitive.tolerance-step=2
app.competitive.tolerance-step-every=5s
app.competitive.demo-seed=${APP_DEMO_SEED:false}
